<div id="global-project-delete-modal"
     class="experience-delete-modal" 
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="global-delete-project-title">
     
    <button type="button"
            class="experience-delete-modal__backdrop"
            popovertarget="global-project-delete-modal"
            popovertargetaction="hide"
            aria-label="Close delete confirmation"></button>
            
    <div class="experience-delete-modal__content">
        <button type="button"
                class="experience-delete-modal__close"
                popovertarget="global-project-delete-modal"
                popovertargetaction="hide"
                aria-label="Close delete confirmation">×</button>
                
        <h2 id="global-delete-project-title">Delete Project?</h2>
        
        <p>
            Are you sure you want to delete the project
            <strong id="delete-modal-project-name"></strong>?
        </p>
        
        <form id="delete-project-modal-form" method="post" action="">
            {% csrf_token %}
            <div class="experience-delete-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="global-project-delete-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="button button-danger">Yes, Delete</button>
            </div>
        </form>
    </div>
</div>
